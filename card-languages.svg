<rect x="1" y="1" width="858" height="354" rx="22" fill="none" stroke="#6E2F4C" stroke-width="1.5"/>
<text x="838" y="344" text-anchor="end" font-size="10" fill="#C49DA4" opacity=".8">itzzshut · github</text>
