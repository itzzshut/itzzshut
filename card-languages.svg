  </rect>
  
  <text class="fade" x="40" y="58" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" font-style="italic" fill="#F9C3D1">Language Stack</text><text class="fade" style="animation-delay:.2s" x="40" y="84" font-size="13.5" font-weight="600" fill="#F6E7E1">Repository-weighted across public repos</text>
  <text x="820" y="54" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="700" fill="#F48FAB">&gt; stack.scan <tspan class="blink">_</tspan></text>
  
  <g class="fade" style="animation-delay:0.30s">
