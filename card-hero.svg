<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1C0A13"/><stop offset="55%" stop-color="#38142A"/><stop offset="100%" stop-color="#1C0A13"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="50%" stop-color="#FFE3EA" stop-opacity=".09"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
  <clipPath id="card"><rect x="1" y="1" width="858" height="208" rx="22"/></clipPath>
  <linearGradient id="name" x1="230.0" y1="0" x2="630.0" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#F9C3D1"><animate attributeName="stop-color" values="#F9C3D1;#F48FAB;#EDB98F;#F9C3D1" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#F48FAB"><animate attributeName="stop-color" values="#F48FAB;#EDB98F;#FFE3EA;#F48FAB" dur="9s" repeatCount="indefinite"/></stop>
  </linearGradient>
</defs>
<style>
  .fade { opacity:0; animation:fade .8s ease-out forwards; }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @keyframes blink { 50% { opacity:0; } }
  .blink { animation:blink 1.1s steps(1) infinite; }
  
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; transform:none !important; } }
</style>
<g clip-path="url(#card)">
  <rect width="860" height="210" fill="url(#paper)"/>
  <g filter="url(#glow)">
    <circle cx="90" cy="30" r="95" fill="#E07A93" opacity=".55">
      <animate attributeName="cx" values="90;190;90" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;.2;.55" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="190" r="105" fill="#C2557A" opacity=".6">
      <animate attributeName="cy" values="190;110;190" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;.65;.3" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="240" r="95" fill="#EDB98F" opacity=".35">
      <animate attributeName="cx" values="430;310;430" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;.12;.35" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="20" r="60" fill="#CFA0C8" opacity=".25">
      <animate attributeName="opacity" values=".1;.35;.1" dur="10s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="-300" y="0" width="240" height="210" fill="url(#sheen)" transform="skewX(-18)">
    <animate attributeName="x" values="-300;1160;1160" keyTimes="0;.4;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  
  <path d="M 60 22 C 260 2, 600 44, 800 14" fill="none" stroke="#F2A7B8" stroke-width="1.2" opacity=".7"/>
  <text x="70" y="66" font-size="14" fill="#F48FAB">✦<animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></text><text x="48" y="92" font-size="9" fill="#F48FAB">✦<animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></text><text x="92" y="104" font-size="10" fill="#EDB98F">✦<animate attributeName="opacity" values="1;.3;1" dur="3.7s" repeatCount="indefinite"/></text><text x="776" y="58" font-size="14" fill="#F48FAB">✦<animate attributeName="opacity" values=".3;1;.3" dur="2.9s" repeatCount="indefinite"/></text><text x="800" y="84" font-size="9" fill="#F48FAB">✦<animate attributeName="opacity" values="1;.2;1" dur="3.3s" repeatCount="indefinite"/></text><text x="756" y="96" font-size="10" fill="#EDB98F">✦<animate attributeName="opacity" values=".2;1;.2" dur="3.9s" repeatCount="indefinite"/></text>
  <text class="fade" x="430.0" y="52" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#F48FAB" letter-spacing="1">@itzzshut</text>
  <text class="fade" style="animation-delay:.25s" x="430.0" y="104" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="50" font-weight="700" font-style="italic" fill="url(#name)">Mariam Malik</text>
  <text class="fade" style="animation-delay:.5s" x="430.0" y="132" text-anchor="middle" font-size="15.5" font-weight="500" fill="#F6E7E1">Software Engineer · B.E. CSE, Jadavpur University · Full-stack apps</text>
  <g class="fade" style="animation-delay:0.90s"><rect x="210.0" y="146" width="68" height="30" rx="15" fill="#2A1120" stroke="#F2A7B8" stroke-width="1.5"/><text x="244.0" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#F9C3D1">React</text></g><g class="fade" style="animation-delay:1.02s"><rect x="288.0" y="146" width="83" height="30" rx="15" fill="#2A1120" stroke="#F2A7B8" stroke-width="1.5"/><text x="329.5" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#F9C3D1">Next.js</text></g><g class="fade" style="animation-delay:1.14s"><rect x="381.0" y="146" width="83" height="30" rx="15" fill="#2A1120" stroke="#F2A7B8" stroke-width="1.5"/><text x="422.5" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#F9C3D1">Node.js</text></g><g class="fade" style="animation-delay:1.26s"><rect x="474.0" y="146" width="60" height="30" rx="15" fill="#2A1120" stroke="#F2A7B8" stroke-width="1.5"/><text x="504.0" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#F9C3D1">Hono</text></g><g class="fade" style="animation-delay:1.38s"><rect x="544.0" y="146" width="106" height="30" rx="15" fill="#2A1120" stroke="#F2A7B8" stroke-width="1.5"/><text x="597.0" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#F9C3D1">PostgreSQL</text></g>
</g>
<rect x="1" y="1" width="858" height="208" rx="22" fill="none" stroke="#6E2F4C" stroke-width="1.5"/>
<text x="838" y="198" text-anchor="end" font-size="10" fill="#C49DA4" opacity=".8">itzzshut · github</text>
</svg>