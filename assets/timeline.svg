<svg viewBox="0 0 860 250" width="860" height="250" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="edu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="work" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EC4899"/><stop offset="100%" stop-color="#F97316"/></linearGradient>
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
    .lbl { opacity: 0; animation: fade .6s ease-out forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.4s; }
    .year { fill: #C4B5FD; font-size: 12px; font-weight: 600; }
    .role { fill: #F5F3FF; font-size: 13px; font-weight: 700; }
    .date { fill: #C4B5FD; font-size: 12px; font-weight: 500; }
    .legend { fill: #E9D5FF; font-size: 12px; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fade { to { opacity: 1; } }
  </style>
</defs>

<rect width="860" height="250" rx="16" fill="#0F0B24"/>

<!-- year axis: x = 60 + (year - 2022) * 170 -->
<line x1="60" y1="52" x2="820" y2="52" stroke="#3B2A7A" stroke-width="2"/>
<g class="year" text-anchor="middle">
  <text x="60" y="38">2022</text><text x="230" y="38">2023</text><text x="400" y="38">2024</text><text x="570" y="38">2025</text><text x="740" y="38">2026</text>
</g>
<g stroke="#3B2A7A" stroke-width="1" stroke-dasharray="2 4">
  <line x1="60" y1="52" x2="60" y2="210"/><line x1="230" y1="52" x2="230" y2="210"/><line x1="400" y1="52" x2="400" y2="210"/>
  <line x1="570" y1="52" x2="570" y2="210"/><line x1="740" y1="52" x2="740" y2="210"/>
</g>

<!-- Class XII: Apr 2022 (milestone) -->
<g class="lbl d1">
  <circle cx="106" cy="92" r="8" fill="#FBBF24" stroke="#FEF3C7" stroke-width="2">
    <animate attributeName="r" values="8;10;8" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="124" y="96"><tspan class="role">Class XII · Happy Model School</tspan><tspan class="date" dx="8">Apr 2022 · 98.6%</tspan></text>
</g>

<!-- B.E.: 2022 - May 2026 -->
<text class="lbl d2" x="162" y="130"><tspan class="role">B.E. Computer Science &amp; Engineering · Jadavpur University</tspan><tspan class="date" dx="8">2022 – 2026</tspan></text>
<rect class="bar d2" x="162" y="138" width="641" height="14" rx="7" fill="url(#edu)"/>

<!-- Louisa AI: Jan 2026 - May 2026 -->
<text class="lbl d3" x="803" y="180" text-anchor="end"><tspan class="role">Software Engineer Intern · Louisa AI</tspan><tspan class="date" dx="8">Jan – May 2026</tspan></text>
<rect class="bar d3" x="740" y="188" width="63" height="14" rx="7" fill="url(#work)"/>

<!-- legend -->
<g class="legend">
  <rect x="60" y="224" width="22" height="10" rx="5" fill="url(#edu)"/><text x="90" y="233">Education</text>
  <rect x="170" y="224" width="22" height="10" rx="5" fill="url(#work)"/><text x="200" y="233">Experience</text>
  <circle cx="291" cy="229" r="5" fill="#FBBF24"/><text x="303" y="233">Milestone</text>
</g>
</svg>
