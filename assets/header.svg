<svg viewBox="0 0 854 230" width="854" height="230" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<!--
  Palette "Aurora":
    ink #0F0B24 · plum #1E1446 · violet #8B5CF6 · pink #EC4899 · coral #F97316
    amber #FBBF24 · cyan #22D3EE · mint #34D399 · text #F5F3FF · lilac #C4B5FD
-->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0F0B24"/>
    <stop offset="100%" stop-color="#1E1446"/>
  </linearGradient>

  <linearGradient id="name" x1="0" y1="0" x2="854" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#8B5CF6;#EC4899;#F97316;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#EC4899"><animate attributeName="stop-color" values="#EC4899;#F97316;#FBBF24;#22D3EE;#EC4899" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#FBBF24"><animate attributeName="stop-color" values="#FBBF24;#22D3EE;#8B5CF6;#EC4899;#FBBF24" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>

  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8B5CF6"/>
    <stop offset="35%" stop-color="#EC4899"/>
    <stop offset="70%" stop-color="#F97316"/>
    <stop offset="100%" stop-color="#FBBF24"/>
  </linearGradient>

  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="38"/>
  </filter>

  <clipPath id="card"><rect width="854" height="230" rx="18"/></clipPath>

  <style>
    .fade { opacity: 0; animation: fade 1s ease-out forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .7s; } .d3 { animation-delay: 1.2s; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .glyph { font-family: "Fira Code",Consolas,monospace; font-weight: 700; }
  </style>
</defs>

<g clip-path="url(#card)">
  <rect width="854" height="230" fill="url(#bg)"/>

  <!-- drifting aurora blobs -->
  <g filter="url(#blur)" opacity=".55">
    <circle cx="120" cy="60" r="80" fill="#8B5CF6"><animate attributeName="cx" values="120;200;120" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="70" r="80" fill="#EC4899"><animate attributeName="cy" values="70;140;70" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="210" r="70" fill="#22D3EE"><animate attributeName="cx" values="430;340;430" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="210" r="55" fill="#F97316"><animate attributeName="cx" values="820;760;820" dur="9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating code glyphs -->
  <g class="glyph" font-size="22" opacity=".5">
    <text x="48" y="190" fill="#22D3EE">&lt;/&gt;<animate attributeName="y" values="190;178;190" dur="5s" repeatCount="indefinite"/></text>
    <text x="770" y="44" fill="#FBBF24">{ }<animate attributeName="y" values="44;56;44" dur="6s" repeatCount="indefinite"/></text>
    <text x="60" y="52" fill="#EC4899">=&gt;<animate attributeName="y" values="52;62;52" dur="7s" repeatCount="indefinite"/></text>
    <text x="760" y="196" fill="#34D399">[ ]<animate attributeName="y" values="196;184;196" dur="5.5s" repeatCount="indefinite"/></text>
  </g>

  <text class="fade d1" x="427" y="96" text-anchor="middle" font-size="58" font-weight="800" fill="url(#name)" letter-spacing="1">Mariam Malik</text>
  <text class="fade d2" x="427" y="136" text-anchor="middle" font-size="19" font-weight="600" fill="#F5F3FF">Software Engineer · Full-Stack Developer</text>
  <text class="fade d3" x="427" y="166" text-anchor="middle" font-size="14" font-weight="500" fill="#C4B5FD" letter-spacing="1.5">REACT · NEXT.JS · NODE.JS · HONO · BUN · POSTGRESQL · MONGODB</text>

  <!-- gradient wave along the bottom -->
  <path fill="url(#wave)" opacity=".9" d="M0 214 C 140 196, 280 232, 427 214 S 714 196, 854 214 L 854 230 L 0 230 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 214 C 140 196, 280 232, 427 214 S 714 196, 854 214 L 854 230 L 0 230 Z;
              M0 214 C 140 232, 280 196, 427 214 S 714 232, 854 214 L 854 230 L 0 230 Z;
              M0 214 C 140 196, 280 232, 427 214 S 714 196, 854 214 L 854 230 L 0 230 Z"/>
  </path>
</g>
</svg>
