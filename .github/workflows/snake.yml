name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: itzzshut
          outputs: |
            dist/snake-aurora.svg?palette=github&color_snake=%237C3AED&color_dots=%23EBEDF0,%23DDD6FE,%23F9A8D4,%23EC4899,%23F97316
            dist/snake-aurora-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%23161B22,%233B1F6E,%237C3AED,%23EC4899,%23FBBF24

      - name: Push Snake to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
